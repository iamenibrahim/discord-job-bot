name: Internship Alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: internship-alerts
  cancel-in-progress: false

jobs:
  check-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare new listings
        env:
          PREPARE_FILE: jobs_to_post.json
          SEND_EXISTING_ON_FIRST_RUN: "false"
          MAX_POST_AGE_DAYS: "14"
        run: python simplify_discord_webhook.py

      - name: Save seen jobs before sending
        run: |
          if [ ! -f seen_jobs.json ]; then
            exit 0
          fi
          git config user.name "internship-bot"
          git config user.email "internship-bot@users.noreply.github.com"
          git add seen_jobs.json
          git diff --cached --quiet && exit 0
          git commit -m "Update seen internships"
          git pull --rebase --autostash
          git push

      - name: Send prepared listings
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_FILE: jobs_to_post.json
        run: python simplify_discord_webhook.py
